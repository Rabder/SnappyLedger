<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expense Log">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@keyframes flashIn { from{ opacity:0; transform:scale(0.98) } to{ opacity:1; transform:scale(1) } }
body{margin:0;background:oklch(9% 0.01 250);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:24px 0}
a{color:oklch(75% 0.15 275)}
a:hover{color:oklch(82% 0.13 275)}
</style>
</helmet>
<div style="width:390px;height:844px;border-radius:44px;background:oklch(13% 0.012 250);border:1px solid oklch(100% 0 0 / 0.08);box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);position:relative;overflow:hidden;display:flex;flex-direction:column">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:18px 24px 4px;flex:none">
    <span style="font:600 15px 'Space Mono',monospace;color:oklch(97% 0.004 250)">{{ nowTime }}</span>
    <div style="width:22px;height:11px;border:1.5px solid oklch(97% 0.004 250 / 0.6);border-radius:3px;position:relative;display:flex;align-items:center;padding:1.5px"><div style="width:70%;height:100%;background:oklch(97% 0.004 250 / 0.8);border-radius:1px"></div></div>
  </div>

  <div style="flex:none;padding:10px 24px 0">
    <span style="font:700 22px 'Manrope';color:oklch(97% 0.004 250)">History</span>
  </div>

  <div style="flex:none;display:flex;gap:8px;overflow-x:auto;padding:14px 24px 0">
    <sc-for list="{{ chips }}" as="chip" hint-placeholder-count="7">
      <button onClick="{{ chip.onClick }}" style="flex:none;padding:8px 14px;border-radius:16px;border:none;font:600 12.5px 'Manrope';background:{{ chip.bg }};color:{{ chip.color }};white-space:nowrap" style-hover="opacity:0.9">{{ chip.label }}</button>
    </sc-for>
  </div>

  <div style="flex:1;overflow-y:auto;padding:12px 24px 8px">
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:80px 20px;text-align:center">
        <span style="font:600 14px 'Manrope';color:oklch(55% 0.012 250)">No expenses in this category yet</span>
      </div>
    </sc-if>
    <sc-for list="{{ groups }}" as="grp" hint-placeholder-count="3">
      <div style="margin-top:14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 8px">
          <span style="font:700 13px 'Manrope';color:oklch(60% 0.012 250);text-transform:uppercase;letter-spacing:0.06em">{{ grp.day }}</span>
          <span style="font:700 13px 'Space Mono',monospace;color:oklch(70% 0.012 250)">{{ grp.subtotal }}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px">
          <sc-for list="{{ grp.entries }}" as="row" hint-placeholder-count="3">
            <button onClick="{{ row.onClick }}" style="display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px;border:none;background:transparent;text-align:left;width:100%;box-sizing:border-box" style-hover="background:oklch(18% 0.013 250)" style-active="transform:scale(0.99)">
              <span style="width:36px;height:36px;border-radius:11px;background:{{ row.color }};flex:none;display:flex;align-items:center;justify-content:center;font:700 13px 'Manrope';color:#fff">{{ row.letter }}</span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
                <span style="font:600 13.5px 'Manrope';color:oklch(95% 0.004 250);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ row.label }}</span>
                <span style="font:500 11.5px 'Manrope';color:oklch(52% 0.012 250)">{{ row.catLabel }}</span>
              </span>
              <span style="font:700 14px 'Space Mono',monospace;color:oklch(95% 0.004 250);flex:none">{{ row.amountDisplay }}</span>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex:none;background:oklch(15% 0.012 250);border-top:1px solid oklch(100% 0 0 / 0.08);padding:10px 24px 22px;display:flex;justify-content:space-around">
    <a href="Expense Quick Log.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;opacity:0.55">
      <span style="width:22px;height:22px;border-radius:7px;border:1.8px solid oklch(90% 0.008 250)"></span>
      <span style="font:600 10.5px 'Manrope';color:oklch(90% 0.008 250)">Log</span>
    </a>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border-radius:7px;background:oklch(70% 0.16 275)"></span>
      <span style="font:700 10.5px 'Manrope';color:oklch(97% 0.004 250)">History</span>
    </div>
  </div>

  <sc-if value="{{ detail }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeDetail }}" style="position:absolute;inset:0;background:oklch(0% 0 0 / 0.5);z-index:8"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;background:oklch(16% 0.013 250);border-radius:24px 24px 0 0;padding:24px 24px 30px;z-index:9;box-shadow:0 -20px 40px rgba(0,0,0,0.4);animation:flashIn 0.2s ease">
      <div style="width:36px;height:4px;border-radius:2px;background:oklch(100% 0 0 / 0.18);margin:0 auto 18px"></div>
      <div style="display:flex;align-items:center;gap:12px">
        <span style="width:44px;height:44px;border-radius:13px;background:{{ detail.color }};display:flex;align-items:center;justify-content:center;font:700 16px 'Manrope';color:#fff">{{ detail.letter }}</span>
        <div style="display:flex;flex-direction:column;gap:2px">
          <span style="font:700 16px 'Manrope';color:oklch(97% 0.004 250)">{{ detail.label }}</span>
          <span style="font:500 12.5px 'Manrope';color:oklch(58% 0.012 250)">{{ detail.catLabel }} · {{ detail.dateFull }}</span>
        </div>
      </div>
      <div style="margin-top:20px;font:700 40px 'Space Mono',monospace;color:oklch(97% 0.004 250)">{{ detail.amountDisplay }}</div>
      <button onClick="{{ closeDetail }}" style="margin-top:20px;width:100%;padding:14px;border:none;border-radius:14px;background:oklch(21% 0.015 250);color:oklch(95% 0.004 250);font:600 14px 'Manrope'" style-hover="background:oklch(25% 0.016 250)">Close</button>
    </div>
  </sc-if>

  <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:oklch(100% 0 0 / 0.3)"></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const CATS = [
  { id: 'rent', letter: 'R', label: 'Rent', color: 'oklch(65% 0.14 30)' },
  { id: 'food', letter: 'F', label: 'Food', color: 'oklch(65% 0.15 150)' },
  { id: 'transport', letter: 'T', label: 'Transport', color: 'oklch(60% 0.15 250)' },
  { id: 'subs', letter: 'S', label: 'Subscriptions', color: 'oklch(60% 0.15 300)' },
  { id: 'ent', letter: 'E', label: 'Entertainment', color: 'oklch(63% 0.18 20)' },
  { id: 'other', letter: 'O', label: 'Other', color: 'oklch(48% 0.02 250)' },
];
const ENTRIES = [
  { id: 1, cat: 'food', label: 'Coffee', amount: 4.50, day: 'Today', dateFull: 'Aug 3, 2026' },
  { id: 2, cat: 'transport', label: 'Uber', amount: 12.00, day: 'Today', dateFull: 'Aug 3, 2026' },
  { id: 3, cat: 'food', label: 'Groceries', amount: 38.20, day: 'Today', dateFull: 'Aug 3, 2026' },
  { id: 4, cat: 'subs', label: 'Netflix', amount: 15.99, day: 'Yesterday', dateFull: 'Aug 2, 2026' },
  { id: 5, cat: 'transport', label: 'Gas', amount: 32.00, day: 'Yesterday', dateFull: 'Aug 2, 2026' },
  { id: 6, cat: 'rent', label: 'Rent', amount: 1450.00, day: 'Jul 28', dateFull: 'Jul 28, 2026' },
  { id: 7, cat: 'ent', label: 'Movie tickets', amount: 24.00, day: 'Jul 28', dateFull: 'Jul 28, 2026' },
  { id: 8, cat: 'food', label: 'Lunch', amount: 11.50, day: 'Jul 28', dateFull: 'Jul 28, 2026' },
  { id: 9, cat: 'subs', label: 'Spotify', amount: 9.99, day: 'Jul 25', dateFull: 'Jul 25, 2026' },
  { id: 10, cat: 'transport', label: 'Parking', amount: 6.00, day: 'Jul 25', dateFull: 'Jul 25, 2026' },
  { id: 11, cat: 'other', label: 'Book', amount: 18.00, day: 'Jul 25', dateFull: 'Jul 25, 2026' },
];

function catOf(id) { return CATS.find(c => c.id === id); }
function money(n) { return '$' + n.toFixed(2); }

class Component extends DCLogic {
  state = { filterCat: 'all', detail: null };

  formatClock() {
    const n = new Date();
    let h = n.getHours() % 12; if (h === 0) h = 12;
    const m = String(n.getMinutes()).padStart(2, '0');
    return h + ':' + m;
  }

  setFilter(id) { this.setState({ filterCat: id }); }
  openDetail(entry) { this.setState({ detail: entry }); }
  closeDetail() { this.setState({ detail: null }); }

  mkRow(e) {
    const c = catOf(e.cat);
    return {
      id: e.id, label: e.label, catLabel: c.label, letter: c.letter, color: c.color,
      amountDisplay: money(e.amount),
      onClick: () => this.openDetail({ ...e, catLabel: c.label, letter: c.letter, color: c.color, amountDisplay: money(e.amount) }),
    };
  }

  renderVals() {
    const s = this.state;
    const entries = s.filterCat === 'all' ? ENTRIES : ENTRIES.filter(e => e.cat === s.filterCat);
    const order = [];
    const byDay = {};
    entries.forEach(e => {
      if (!byDay[e.day]) { byDay[e.day] = []; order.push(e.day); }
      byDay[e.day].push(e);
    });
    const groups = order.map(day => {
      const es = byDay[day];
      const subtotal = es.reduce((sum, e) => sum + e.amount, 0);
      return { day, subtotal: money(subtotal), entries: es.map(e => this.mkRow(e)) };
    });
    const chips = [{ id: 'all', label: 'All' }, ...CATS.map(c => ({ id: c.id, label: c.label }))].map(c => ({
      label: c.label,
      bg: s.filterCat === c.id ? 'oklch(70% 0.16 275)' : 'oklch(19% 0.014 250)',
      color: s.filterCat === c.id ? '#fff' : 'oklch(85% 0.01 250)',
      onClick: () => this.setFilter(c.id),
    }));
    return {
      nowTime: this.formatClock(),
      chips,
      groups,
      isEmpty: entries.length === 0,
      detail: s.detail,
      closeDetail: () => this.closeDetail(),
    };
  }
}
</script>
</body>
</html>
